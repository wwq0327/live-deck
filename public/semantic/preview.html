<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语义舞台 · 稳定增量预览</title>
  <link rel="stylesheet" href="./theme.css" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #020c08; color: #e8f2eb; font-family: 'PingFang SC', system-ui, sans-serif; }
    .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; padding: 18px; min-height: 100vh; box-sizing: border-box; }
    .stage-holder { position: relative; min-height: 640px; }
    .panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: rgba(7, 30, 21, 0.85); border: 1px solid rgba(120, 189, 149, 0.22); }
    .panel h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
    .panel p { margin: 0; font-size: 12px; color: #9db8a9; line-height: 1.6; }
    button { font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(120, 189, 149, 0.35); background: rgba(20, 60, 42, 0.8); color: #e8f2eb; cursor: pointer; }
    button:hover { border-color: #4fe08d; }
    button:disabled { opacity: 0.45; cursor: default; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat { font-size: 12px; color: #9db8a9; line-height: 1.8; }
    .stat b { color: #4fe08d; font-weight: 600; }
    .step { font-size: 12px; color: #cfe6d8; min-height: 34px; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage-holder" id="stage"></div>
    <aside class="panel">
      <h1>稳定 ID 增量演示</h1>
      <p>每一步只增删或修改受影响的节点/边。观察左侧对象是否被重建，面板统计保持身份的元素数量。</p>
      <div class="step" id="step-label">准备开始</div>
      <div class="row">
        <button id="next">下一步</button>
        <button id="auto">自动播放</button>
        <button id="reset">重置</button>
        <button id="motion">减少动态：关</button>
      </div>
      <div class="stat" id="stats"></div>
    </aside>
  </div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
